<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>WAD Homework 2</title>
    <style>
      a:link {
        color: black;
        background-color: transparent;
        text-decoration: none;
      }
    </style>
  </head>
  <body>

    <header class="header">
      <a href="index.html"><strong>Home</strong></a>
      <a class="logo" href="#"><img src="img/download.png" width="80" height="80" alt="My picture"></a>
    </header>

    <h1>Fetch API</h1>
    <div id="posts" class="posts-grid"></div>   <!-- empty container; JavaScript fills it -->

    <script>
      // pictures taken from -> https://picsum.photos/images
      // json editor / validator -> https://jsoneditoronline.org/#

      //fetch('https://api.npoint.io/07be7bd5624d953de6c4')  // task 4: same code, pointed at the online endpoint
      fetch('res/myjson.json')                               // task 5: same code, pointed at the local file
        .then(response => response.json())                   // the download arrives as text; turn it into a real array
        .then(json => {
          console.log(json);                                 // print the array so we can inspect it in the console

          for (let singleJsonPost of json) {                 // walk the array one post at a time
            let postDiv = document.createElement('div');     // make an empty <div> for this post
            postDiv.className = "post";                      // give it .post so style.css styles it as a card

            let postTitle = document.createElement('h3');    // card heading
            postTitle.innerText = singleJsonPost.city + " - " + singleJsonPost.country;

            let postAuthor = document.createElement('p');    // author line
            postAuthor.innerText = singleJsonPost.first_name + " " + singleJsonPost.last_name
                                 + ", Age: " + singleJsonPost.age
                                 + ", Sex: " + singleJsonPost.sex;

            let postDate = document.createElement('p');      // creation time, required by task 1
            postDate.className = "post-date";
            postDate.innerText = singleJsonPost.created;

            let postText = document.createElement('p');      // the post's own text
            postText.innerText = singleJsonPost.text;

            let postImage = document.createElement('img');   // the picture
            postImage.src = singleJsonPost.photo;            // task 6: JSON holds only text, so we store a URL

            postDiv.appendChild(postTitle);                  // assemble the card, in display order
            postDiv.appendChild(postAuthor);
            postDiv.appendChild(postDate);
            postDiv.appendChild(postText);
            postDiv.appendChild(postImage);

            document.getElementById('posts').appendChild(postDiv);  // attach the finished card to the page
          }
        })
        .catch(err => {                                      // runs only if any step above failed
          let errDiv = document.createElement("div");
          errDiv.className = 'post';
          errDiv.innerText = err;
          document.body.appendChild(errDiv);
        })
        .finally(() => {                                     // runs either way, success or failure
          let footer = document.createElement("footer");
          let date = new Date().toLocaleString();
          footer.innerText = date;
          document.body.appendChild(footer);
        });
    </script>
  </body>
</html>
